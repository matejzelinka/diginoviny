<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Skutečské noviny {{issue.month}}/{{issue.year}}</title><link rel="stylesheet" href="/static/style.css"></head><body>
<header class="top"><div class="topin"><a class="brand" href="/">SKUTEČSKÉ NOVINY</a><span>{{issue.month}}/{{issue.year}}</span></div></header><main class="wrap hero"><div class="eyebrow">Digitální vydání</div><h1>Skutečské<br>noviny</h1><h2>Obsah čísla</h2><div class="grid">{% for a in issue.articles %}<a class="card" href="/{{issue.year}}/{{'%02d'|format(issue.month)}}/{{slugify(a.title)}}/"><span class="cat cat-{{a.category}}">{{a.categoryLabel}}</span><h2>{{a.title}}</h2><p>{{a.text[:240]}}…</p><b>Číst článek →</b></a>{% endfor %}</div></main></body></html>
