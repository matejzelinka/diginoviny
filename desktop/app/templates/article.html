<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{article.title}}</title><link rel="stylesheet" href="/static/style.css"></head><body>
<header class="top"><div class="topin"><a class="brand" href="/{{issue.year}}/{{'%02d'|format(issue.month)}}/">← OBSAH VYDÁNÍ</a><span>{{issue.month}}/{{issue.year}}</span></div></header><main class="wrap article"><span class="cat cat-{{article.category}}">{{article.categoryLabel}}</span><h1>{{article.title}}</h1><div class="audio"><button class="primary" onclick="speak()">▶ Přečíst nahlas</button><button class="ghost" onclick="speechSynthesis.pause()">Pauza</button><button class="ghost" onclick="speechSynthesis.resume()">Pokračovat</button><button class="ghost" onclick="speechSynthesis.cancel()">Stop</button></div><div id="articleText" class="articletext">{{article.text}}</div></main><script>
function speak(){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(document.getElementById('articleText').innerText);u.lang='cs-CZ';u.rate=.95;let vs=speechSynthesis.getVoices();u.voice=vs.find(v=>v.lang.toLowerCase()==='cs-cz')||vs.find(v=>v.lang.toLowerCase().startsWith('cs'))||null;speechSynthesis.speak(u)}
</script></body></html>
