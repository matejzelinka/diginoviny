<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Skutečské noviny</title><link rel="stylesheet" href="/static/style.css"></head><body>
<header class="top"><div class="topin"><span class="brand">SKUTEČSKÉ NOVINY</span><span>Digitální archiv</span></div></header><main class="wrap hero"><div class="eyebrow">Město Skuteč</div><h1>Skutečské<br>noviny</h1><h2>Všechna vydání</h2><div class="grid">{% for i in issues %}<a class="card" href="/{{i.year}}/{{'%02d'|format(i.month)}}/"><div class="eyebrow">Digitální vydání</div><h2>{{i.month}}/{{i.year}}</h2><p>{{i.articles|length}} článků</p><b>Otevřít vydání →</b></a>{% else %}<p>Zatím není publikované žádné vydání.</p>{% endfor %}</div></main></body></html>
