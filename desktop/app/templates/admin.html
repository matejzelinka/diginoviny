<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administrace novin</title><link rel="stylesheet" href="/static/style.css"></head><body>
<header class="top"><div class="topin"><span class="brand">SKUTEČSKÉ NOVINY · DIGITÁLNÍ EDITOR</span></div></header><main class="wrap"><h1>Vydání</h1><form class="form" action="/admin/upload" method="post" enctype="multipart/form-data"><h2>Nové vydání</h2><div class="formrow"><input type="number" name="month" min="1" max="12" placeholder="Měsíc" required><input type="number" name="year" min="2020" value="2026" required><input type="file" name="pdf" accept=".pdf" required><button class="primary">Nahrát a zpracovat PDF</button></div></form>
<table><tr><th>Vydání</th><th>Články</th><th>Stav</th><th></th></tr>{% for i in issues %}<tr><td>{{i.month}}/{{i.year}}</td><td>{{i.articles|length}}</td><td>{{"Publikováno" if i.published else "Rozpracováno"}}</td><td><a class="btn ghost" href="/admin/editor/{{i.id}}">Otevřít editor</a></td></tr>{% endfor %}</table></main></body></html>
